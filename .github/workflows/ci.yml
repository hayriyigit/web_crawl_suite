name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless, and the
# integration job holds a runner for minutes while it drives real browsers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock does not match pyproject.toml instead of quietly resolving
  # something else. Without this, CI can run different versions from every
  # developer machine, and the difference only shows up as a test that fails in
  # one place and passes in the other.
  UV_FROZEN: "1"

jobs:
  lint-and-unit:
    # The unit suite needs no browser, so it stays fast enough to run on every
    # supported interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pins the interpreter for *every* uv command, not just the sync. Passing
      # --python only to `uv sync` left the later `uv run` steps falling back to
      # uv's default interpreter, which deleted the matrix venv and rebuilt it
      # on the wrong version with none of the extras -- 141 packages became 26,
      # so scrapy was simply absent and only the 3.13 leg (the default) passed.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra all
      # `uv run` re-syncs before running, and without --extra it syncs to the
      # base dependency set. Repeating it on every step keeps the extras
      # installed no matter what uv decides to do to the environment.
      # examples/ is part of the linted surface locally; leaving it out here let
      # a broken example reach main.
      - run: uv run --extra all ruff check src/ tests/ examples/
      - run: uv run --extra all ruff format --check src/ tests/ examples/
      - run: uv run --extra all pytest -m "not integration" -q

  integration:
    # Real browsers against the local test site: one interpreter is enough, and
    # this is what proves the backends actually render and agree with each other.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra all

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # and Chromium's sandbox needs them: without this the browser reports
      # "Chromium sandboxing failed!", closes immediately, and every rendered
      # fetch fails with TargetClosedError. Re-enabling them keeps the sandbox
      # on, which is the point -- passing --no-sandbox instead would make the
      # suite test a browser configuration nobody should deploy.
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Chromium is ~150 MB and unchanged between runs; keyed on the lockfile so
      # a playwright bump invalidates it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # --with-deps installs system libraries and is not covered by the cache,
      # so it runs either way; only the browser download is skipped.
      - run: uv run --extra all playwright install chromium --with-deps

      - run: uv run --extra all pytest -m integration -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # A wheel that installs but cannot resolve its own console script or
      # backends is the failure mode this catches.
      - run: |
          uv venv /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/polycrawl backends
